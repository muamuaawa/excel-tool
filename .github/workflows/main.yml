name: Build Windows EXE

# 添加权限配置
permissions:
  contents: write

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # 升级到 v4

      - name: Setup Python
        uses: actions/setup-python@v5  # 升级到 v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas openpyxl pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --console --name excelhelper main.py  # 确保此处脚本名正确（比如你的 main.py）

      - name: Upload artifact
        uses: actions/upload-artifact@v4  # 升级到 v4
        with:
          name: windows-exe
          path: dist/
