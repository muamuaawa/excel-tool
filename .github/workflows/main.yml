name: Build Windows EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - run: pip install pandas openpyxl pyinstaller
    - run: pyinstaller --onefile --name excelhelper main.py
    - uses: actions/upload-artifact@v3
      with:
        name: windows-exe
        path: dist/
