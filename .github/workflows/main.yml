name: Build Windows EXE (压缩优化)

permissions:
  contents: write

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install UPX (压缩工具)
        run: |
          choco install upx -y
          echo "UPX installed"

      - name: Install Python依赖
        run: |
          pip install pandas openpyxl pyinstaller

      - name: Build EXE (带UPX压缩)
        run: pyinstaller --onefile --console --upx-dir="C:/ProgramData/chocolatey/bin" --name Excel合并工具 main.py

      - name: Compress with 7z (高压缩)
        run: |
          7z a -mx=9 windows-exe.7z dist/*

      - name: Upload compressed file
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: windows-exe.7z
